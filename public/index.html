<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2036 Personal AI Network</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <p class="eyebrow">2036 · AI Secretary Network</p>
    <h1>Personal AI Network</h1>
    <p class="tagline">探さない。頼まない。AIが機会を連れてくる。</p>
  </header>

  <main>
    <!-- 画面1：ユーザー一覧（Phase 5 で見た目を整える） -->
    <section>
      <h2>AI秘書ネットワーク上のユーザー</h2>
      <div id="users" class="cards">読み込み中…</div>
    </section>

    <!-- 画面3：AI秘書ログ（Phase 5） -->
    <section>
      <h2>AI秘書ログ</h2>
      <div id="logs" class="logs">まだ探索は始まっていません。</div>
    </section>

    <!-- 画面4：成立結果（Phase 5） -->
    <section>
      <h2>成立した体験</h2>
      <div id="result">—</div>
    </section>

    <!-- 画面2：発表者・開発者用コントロール（一般ユーザー向けではない） -->
    <section class="dev">
      <h2>発表者用コントロール</h2>
      <div class="buttons">
        <button data-endpoint="/api/gemini/test">Gemini 疎通確認</button>
        <button data-endpoint="/api/line/test">LINE Push 疎通確認</button>
        <button data-endpoint="/api/match" class="primary">マッチングデモ開始</button>
      </div>
      <pre id="output">—</pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
